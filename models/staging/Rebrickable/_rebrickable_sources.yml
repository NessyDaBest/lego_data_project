version: 2

sources:
  - name: rebrickable 
    description: >
      Datos raw que proceden de la BD de Rebrickable actualizados
      complementando el dataset principal de Maven Analytics
    schema: REBRICKABLE
    database: "LEGO_{{env_var('DBT_ENVIRONMENTS','FAIL') }}_BRONZE_DB"
  
    quoting: 
      database: false
      schema: false
      identifier: false

    tables:
      - name: colors
        description: "Colores de las piezas de lego ya que una misma pieza puede estar en diferentes colores"
        columns:
          - name: id
            data_type: number
            description: "Identificador del color"
            data_tests:
              - unique
              - not_null
              
          - name: name
            data_type: varchar
            description: "Nombre que se le ha dado al color en cuestion"
            data_tests:
              - not_null
              
          - name: rgb
            data_type: varchar
            description: "Combinacion RGB que da como el resultado el color en cuestion"
            data_tests:
              - not_null
              
          - name: is_trans
            data_type: boolean
            description: "Booleano que verifica con TRUE/FALSE si la pieza es o no transparente"
            data_tests:
              - not_null

          - name: num_parts
            data_type: number
            description: ""
          - name: num_sets
            data_type: number
            description: ""
          - name: y1
            data_type: number
            description: ""
          - name: y2
            data_type: number
            description: ""

      - name: minifigs
        description: "Mini figuras LEGO que conforman los SETS"
        columns:
          - name: fig_num
            data_type: varchar
            description: "Identificador de la mini figura"
            data_tests:
              - unique
              - not_null
              
          - name: name
            data_type: varchar
            description: "nombre de la mini figura"
            data_tests:
              - not_null
              
          - name: num_parts
            data_type: number
            description: "piezas que conforman la mini figura"
            data_tests:
              - not_null
              

          - name: img_url
            data_type: varchar
            description: "Url con la imagen de la mini figura "

      - name: part_categories
        description: "Tabla con todos los tipos de categorias que contienen las piezas"
        columns:
          - name: id
            data_type: number
            description: "Identificador de la categoria"
            data_tests:
              - unique
              - not_null
              

          - name: name
            data_type: varchar
            description: "Nombre de la categoria de la pieza"
            data_tests:
              - not_null
              
      - name: parts
        description: "Piezas que conforman un set"
        columns:
          - name: part_num
            data_type: varchar
            description: "Identificador de la pieza"
            data_tests:
              - unique
              - not_null
              
          - name: name
            data_type: varchar
            description: "Nombre que se le ha atribuido a la pieza"
            data_tests:
              - not_null
              
          - name: part_cat_id
            data_type: number
            description: "id de la categoria de la pieza"
            data_tests:
              - not_null
              - relationships:
                  arguments: 
                    to: source('rebrickable','part_categories')
                    field: id

          - name: part_material
            data_type: varchar
            description: "material del que esta hecho la pieza"
            data_tests:
              - not_null

      - name: inventories
        description: >
          Tabla puente que relaciona cada set LEGO con su inventario de piezas
          y minifiguras. Un set puede tener múltiples versiones de inventario.
        columns:
          - name: id
            data_type: number
            description: "Identificador del inventario."
            data_tests:
              - unique
              - not_null
          - name: version
            data_type: number
            description: "Versión del inventario para el set (normalmente 1)."
            data_tests:
              - not_null
          - name: set_num
            data_type: varchar
            description: "FK al set de LEGO. Coincide con set_id de Maven Analytics."
            data_tests:
              - not_null

      - name: inventory_parts
        description: >
          Detalle de qué piezas, en qué color y en qué cantidad contiene
          cada inventario. Granularidad real para fct_inventario_piezas.
        columns:
          - name: inventory_id
            data_type: number
            description: "FK al inventario."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('rebrickable', 'inventories')
                    field: id
          - name: part_num
            data_type: varchar
            description: "FK a la pieza."
            data_tests:
              - not_null
          - name: color_id
            data_type: number
            description: "FK al color de la pieza."
            data_tests:
              - not_null
          - name: quantity
            data_type: number
            description: "Cantidad de esta pieza+color en el inventario."
            data_tests:
              - not_null
          - name: is_spare
            data_type: boolean
            description: "Indica si la pieza es de repuesto incluida en el set."
            data_tests:
              - not_null

      - name: inventory_minifigs
        description: >
          Detalle de qué minifiguras y en qué cantidad contiene cada inventario.
          Granularidad real para fct_inventario_minifig.
        columns:
          - name: inventory_id
            data_type: number
            description: "FK al inventario."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('rebrickable', 'inventories')
                    field: id
          - name: fig_num
            data_type: varchar
            description: "FK a la minifigura."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('rebrickable', 'minifigs')
                    field: fig_num
                  config: 
                    severity: warn 
          - name: quantity
            data_type: number
            description: "Cantidad de esta minifigura en el inventario."
            data_tests:
              - not_null
      - name: raw_nuevos_sets
        description: >   
          Tabla incremental creada a partir de script de python la cual extrae mediante
          la API de Rebrickable nuevos sets mas actualizados.
        columns:
          - name: set_num
            data_type: varchar
            description: "Identificador del set. Mismo formato que set_id de Maven Analytics."
            data_tests:
              - not_null

          - name: name
            data_type: varchar
            description: "Nombre del set."
            data_tests:
              - not_null
            
          - name: year
            data_type: number
            description: "Año de lanzamiento del set."
            data_tests:
              - not_null
            
          - name: nombre_tema
            data_type: varchar
            description: "Tema del set en rebrickable."
              
          - name: num_parts
            data_type: number
            description: "Número de piezas del set."
          
          - name: num_minifigs
            data_type: number
            description: "Número de minifiguras del set. Null si la API no lo devuelve."
          
          - name: precio_usd
            data_type: float
            description: "Precio de venta al público en USD. Se actualiza manualmente."
          
          - name: set_img_url
            data_type: varchar
            description: "URL de la imagen oficial del set."
          
          - name: loaded_at
            data_type: timestamp_tz
            description: "Timestamp de carga. Usado como marca incremental en dbt."
            data_tests:
              - not_null