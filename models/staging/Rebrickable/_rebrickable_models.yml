version: 2

models:
  - name: stg_rebrickable__colors
    description: "Catálogo limpio de colores de piezas de LEGO de Rebrickable. Excluye códigos de metadatos del sistema (-1 y 9999)."
    columns:
      - name: id_color
        description: "Clave primaria del color."
        tests:
          - unique
          - not_null

      - name: nombre_color
        description: "Nombre descriptivo del color."
        tests:
          - not_null

      - name: composicion_rgb
        description: "Código hexadecimal de la composición de color RGB."
        tests:
          - not_null

      - name: es_transparente
        description: "Booleano que indica si el material de la pieza deja pasar la luz."
        tests:
          - not_null

  - name: stg_rebrickable__part_categories
    description: "Dimensiones de las categorías macros a las que pertenecen las piezas individuales."
    columns:
      - name: id_categoria
        description: "Clave primaria de la categoría de la pieza."
        tests:
          - unique
          - not_null

      - name: nombre_categoria
        description: "Nombre de la agrupación de la pieza (ej. Bricks, Plates, Tech)."
        tests:
          - not_null

  - name: stg_rebrickable__minifigs
    description: "Catálogo de figuras y personajes oficiales de LEGO incluidos en los inventarios."
    columns:
      - name: id_minifig
        description: "Clave primaria alfanumérica única de la minifigura."
        tests:
          - unique
          - not_null

      - name: nombre_minifig
        description: "Nombre del personaje o descripción de la figura."
        tests:
          - not_null

      - name: numero_piezas
        description: "Cantidad de componentes específicos que arman la minifigura."
        tests:
          - not_null

      - name: url_imagen
        description: "Enlace web a la foto oficial del personaje."

  - name: stg_rebrickable__parts
    description: "Maestro detallado de piezas físicas individuales del catálogo de LEGO."
    columns:
      - name: id_pieza
        description: "Clave primaria alfanumérica única de la pieza."
        tests:
          - unique
          - not_null

      - name: nombre_pieza
        description: "Descripción física de la forma y utilidad de la pieza."
        tests:
          - not_null

      - name: id_categoria
        description: "Clave foránea que conecta con la categoría de la pieza."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_rebrickable__part_categories')
                field: id_categoria

      - name: material_pieza
        description: "Componente de fabricación de la pieza (Plástico, goma, metal, etc.)."
        tests:
          - not_null
          
  - name: stg_rebrickable__inventories
    description: >
      Tabla puente limpia entre sets LEGO y sus inventarios de piezas
      y minifiguras. Un set puede tener múltiples versiones de inventario.
    columns:
      - name: id_inventario
        description: "Clave primaria del inventario."
        tests:
          - unique
          - not_null
      - name: version
        description: "Versión del inventario para el set."
        tests:
          - not_null
      - name: id_set
        description: >
          FK lógica al set. Coincide con id_set de stg_maven_analytics__sets
          en el 95.8% de los casos. El 4.2% restante corresponde a sets
          exclusivos de Rebrickable no presentes en Maven Analytics.
        tests:
          - not_null

  - name: stg_rebrickable__inventory_parts
    description: >
      Detalle de qué piezas, en qué color y en qué cantidad contiene
      cada inventario. Granularidad: id_inventario + id_pieza + id_color.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - id_inventario
              - id_pieza
              - id_color
              - es_repuesto
    columns:
      - name: id_inventario
        description: "FK al inventario."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_rebrickable__inventories')
                field: id_inventario
      - name: id_pieza
        description: "FK a la pieza."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_rebrickable__parts')
                field: id_pieza
              config:
                severity: warn
      - name: id_color
        description: "FK al color de la pieza."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_rebrickable__colors')
                field: id_color
              config:
                severity: warn
      - name: cantidad
        description: "Cantidad de esta pieza+color en el inventario."
        tests:
          - not_null
      - name: es_repuesto
        description: "Indica si la pieza es de repuesto incluida en el set."
        tests:
          - not_null

  - name: stg_rebrickable__inventory_minifigs
    description: >
      Detalle de qué minifiguras y en qué cantidad contiene cada inventario.
      Granularidad: id_inventario + id_minifig.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: 
            combination_of_columns:
              - id_inventario
              - id_minifig
    columns:
      - name: id_inventario
        description: "FK al inventario."
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_rebrickable__inventories')
                field: id_inventario
      - name: id_minifig
        description: "FK a la minifigura."
        tests:
          - not_null
          - relationships:
              arguments: 
                to: ref('stg_rebrickable__minifigs')
                field: id_minifig
              config: 
                severity: warn
      - name: cantidad
        description: "Cantidad de esta minifigura en el inventario."
        tests:
          - not_null
      